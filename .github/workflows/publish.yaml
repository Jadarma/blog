name: 'Publish To GitHub Pages'

# Action Dependency Pins:
# actions/checkout              - 3d3c42e5aac5ba805825da76410c181273ba90b1 - v7.0.1  - https://github.com/actions/checkout/releases
# actions/upload-pages-artifact - fc324d3547104276b827a68afc52ff2a11cc49c9 - v5.0.0  - https://github.com/actions/upload-pages-artifact/releases
# actions/deploy-pages          - 368f82528645a54fb793d4d04e342629a3f51346 - v5.0.1  - https://github.com/actions/deploy-pages/releases
# cachix/install-nix-action     - 13d8dd58da0234aa297dedd986986ccb8e7f3e24 - v31.11.1- https://github.com/cachix/install-nix-action/releases
# cachix/cachix-action          - 38b082610b782e7e93e209c35fd730d399dee866 - v17     - https://github.com/cachix/cachix-action/releases

on:
  push:
    branches:
      - main

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: 'Install Nix'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: 'Configure Cachix'
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
        with:
          name: devenv
      - name: 'Install devenv.sh'
        run: nix profile install nixpkgs#devenv
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 'Build'
        run: devenv shell build
      - name: 'Upload Pages Artifact'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: public

  Deploy:
    needs: 'Build'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
